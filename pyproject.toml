[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futures-engine"
version = "0.0.0"
description = "Research-and-execution system for systematic trend/momentum trading of CME micro futures (MES/MNQ)."
readme = "docs/AUDIT.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2",
    "PyYAML>=6",
    "pyarrow>=15",
    # arch (Kevin Sheppard) provides the stationary/block bootstraps and
    # Politis-White optimal_block_length used by validation.stats. Pulls scipy
    # transitively (bootstrap internals); we do not import scipy directly.
    "arch>=7",
    # NOTE: hmmlearn is deliberately NOT a dependency. It ships no Python 3.14
    # wheel (source build needs a C++ toolchain and is unavailable in CI), and
    # its public predict/decode API smooths over the whole sequence (non-causal),
    # which is forbidden for point-in-time labelling. regime.detector therefore
    # ships a small self-contained Gaussian HMM whose labelling path is a causal
    # forward filter. See docs/regime-hmm-rationale in regime/detector.py.
    # ruptures: offline change-point detection used by
    # regime.detector.ChangePointRegimeDetector. Only its detected breakpoints
    # are consumed; we drive it in an expanding-window loop so the labelling
    # path stays point-in-time (each label at t uses bars <= t only). Pulls
    # scipy transitively. Has Python 3.14 wheels.
    "ruptures>=1.0",
    # scikit-learn (L2-logistic baseline) and LightGBM (gradient-boosted primary)
    # power the meta-model pipeline (research.meta_model, G5/G6). Core deps -- the
    # meta-model is a first-class part of the research stage, not an optional extra.
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    # skfolio: maintained, sklearn-compatible CombinatorialPurgedCV used ONLY as
    # an independent cross-check of CPCV fold structure in tests (never imported
    # by library code). See task-T3 acceptance: CPCV cross-check.
    "skfolio",
    # statsmodels: adfuller (Augmented Dickey-Fuller) used ONLY by the frac_diff
    # test to demonstrate the memory-vs-stationarity trade-off (task-T4
    # acceptance). Not imported by library code, hence dev-only. Has 3.14 wheels.
    "statsmodels>=0.14",
]
# Vendor SDKs live in optional extras only -- never in core dependencies (G1/G2).
# Adapters import these lazily and raise a clear error naming the extra if absent.
databento = ["databento>=0.34"]
norgate = ["norgatedata>=1.0"]
dev-data = ["yfinance>=0.2"]  # DEV ONLY -- NOT FOR VALIDATION (G1)

[project.scripts]
# Look-ahead audit over all registered point-in-time checks (CI + local, G4).
audit-run = "futures_engine.data.audit:main"

[tool.hatch.build.targets.wheel]
packages = ["futures_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# mypy: strict on library code only (futures_engine/). Tests are intentionally
# excluded from the strict gate (they use fixtures/monkeypatching that add noise
# with little safety benefit). See task-T0 brief: "strict-ish on futures_engine/".
[tool.mypy]
python_version = "3.12"
files = ["futures_engine"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Optional vendor SDKs ship no type stubs and are not installed in CI's core/dev
# env; they are imported lazily inside adapters only (G2).
[[tool.mypy.overrides]]
module = ["databento.*", "norgatedata.*", "yfinance.*"]
ignore_missing_imports = true

# ruptures (regime.detector), and lightgbm/sklearn/joblib (research.meta_model)
# ship no complete type stubs; ignore missing imports for these third-party
# libraries without loosening the strict gate elsewhere.
[[tool.mypy.overrides]]
module = ["ruptures.*", "lightgbm.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true
